name: atlantis-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chat
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-51000:50000-51000/udp"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://chat:${POSTGRES_PASSWORD}@postgres:5432/chat?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_WS_URL: wss://${LAN_HOSTNAME}/livekit
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      UPLOADS_ENCRYPTION_KEY: ${UPLOADS_ENCRYPTION_KEY}
      # Number of trusted reverse-proxy hops in front of this container - 1 for
      # Caddy alone (default), 2 when Caddy itself sits behind an existing
      # nginx (see setup.sh --behind-nginx). Wrong value here means every
      # client behind the proxy chain shares one rate-limit bucket.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - livekit
    ports:
      # Bound to 0.0.0.0 by default (Caddy owns 80/443 directly). When run
      # behind an existing nginx (setup.sh --behind-nginx), these are bound
      # to 127.0.0.1 on alternate ports instead, and nginx reverse-proxies
      # to Caddy's loopback HTTPS port - see infra/nginx/cordon.conf.
      - "${CADDY_HTTP_BIND:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/certs:/etc/caddy/certs:ro

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
